name: ai-review

# GENERATED by LazyWaitInternalAPI/scripts/guardrails/sync-guardrails.mjs — do not
# hand-edit.
#
# The reviewer, REVIEW_RULES.md and the score threshold are all read from the BASE
# branch, so a PR cannot soften the review it is subject to.
#
# Required status check for branch protection:
#   review / review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-reusable.yml
    with:
      node_version: '22'
      model: claude-sonnet-5
      min_score: '7'
      max_diff_chars: '120000'
    secrets: inherit
