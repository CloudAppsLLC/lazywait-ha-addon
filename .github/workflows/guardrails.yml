name: guardrails

# GENERATED by LazyWaitInternalAPI/scripts/guardrails/sync-guardrails.mjs — do not
# hand-edit. Change the generator and re-sync, or the next sync overwrites you.
#
# Cost / security / performance gate. The rules live in the reusable workflow and
# in .github/scripts/guardrails.mjs, which CI reads from the BASE branch — a pull
# request cannot weaken the gate that is judging it.
#
# Required status checks for branch protection:
#   checks / patterns

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/guardrails-reusable.yml
    with:
      node_version: '22'
      package_manager: none
      install_dir: .
      build_cmd: ''
      audit: false
      # Non-blocking on purpose for now: these repos carry existing transitive
      # advisories, and a permanently red required check is a check people learn
      # to ignore. Clear the current findings, then flip this to true.
      audit_blocking: false
    secrets: inherit
