configuration:
  TZ:
    name: "ٹائم زون"
    description: "اسٹور کا ٹائم زون، مثلاً Asia/Riyadh۔ رسیدیں Home Assistant کے اپنے ٹائم زون (ترتیبات ← سسٹم ← عمومی) میں پرنٹ ہوتی ہیں، اس لیے وہاں بھی اسٹور کا ٹائم زون سیٹ کریں۔"
  PORT:
    name: "پورٹ"
    description: "وہ پورٹ جس پر پرنٹ سرور سنتا ہے۔ ڈیفالٹ: 80۔"
  LAN_IP:
    name: "LAN IP ایڈریس"
    description: "برانچ نیٹ ورک پر اس ڈیوائس کا IP ایڈریس، مثلاً 192.168.100.150۔ خود بخود معلوم کرنے کے لیے خالی چھوڑ دیں۔"
  LAZYWAIT_API_BASE:
    name: "LazyWait کلاؤڈ URL"
    description: "LazyWait کلاؤڈ API کا پتہ۔ جب تک LazyWait سپورٹ کچھ اور نہ کہے، ڈیفالٹ (https://apiv2.lazywait.com/v1) برقرار رکھیں۔"
  listen_orders:
    name: "آرڈرز خود بخود پرنٹ کریں"
    description: "نئے آرڈرز پر نظر رکھتا ہے اور انہیں خود بخود پرنٹ کرتا ہے۔ اس ڈیوائس پر آرڈرز سننا بند کرنے کے لیے بند کریں۔"
  listen_openings:
    name: "کیشیئر اوپننگز خود بخود پرنٹ کریں"
    description: "کیشیئر اوپننگز پر نظر رکھتا ہے اور انہیں خود بخود پرنٹ کرتا ہے۔ اگر یہ برانچ اوپننگز استعمال نہیں کرتی تو بند کریں۔"
  listen_closings:
    name: "کیشیئر کلوزنگز خود بخود پرنٹ کریں"
    description: "کیشیئر کلوزنگز پر نظر رکھتا ہے اور انہیں خود بخود پرنٹ کرتا ہے۔ اگر یہ برانچ کلوزنگز استعمال نہیں کرتی تو بند کریں۔"
  enable_camera_ai:
    name: "کیمرہ AI کی اجازت دیں"
    description: "کیمرہ AI کا مرکزی سوئچ۔ آن ہونے پر بھی کیمرہ AI کو پرنٹ سرور کے فیچرز صفحے سے آن یا آف کیا جاتا ہے (ڈیفالٹ آف)۔ اس ڈیوائس پر اسے کبھی شروع نہ ہونے دینے کے لیے بند کریں۔"
  enable_live_webrtc:
    name: "براہِ راست لائیو کیمرا ویو"
    description: "LazyWait ایپس کو اس ڈیوائس سے براہِ راست لائیو کیمرا ویڈیو چلانے دیتا ہے (پورٹ 18556 UDP/TCP پر پیئر ٹو پیئر WebRTC)۔ LazyWait کلاؤڈ صرف دونوں طرف کو جڑنے میں مدد دیتا ہے؛ ویڈیو کبھی اس سے نہیں گزرتی۔ بطورِ طے شدہ آن ہے۔ مقامی ویڈیو سروس روکنے کے لیے اسے بند کریں۔"
  enable_loss_prevention:
    name: "نقصان کی روک تھام"
    description: "نقصان کی روک تھام کا ایجنٹ چالو کرتا ہے (ڈیفالٹ طور پر بند)۔ یہ ERP میں منسلک Home Assistant اینٹیٹیز (شٹر، دروازہ، تالا، الارم، روشنیاں، حرکت، کیش دراز) کی نگرانی کرتا ہے اور دستخط شدہ نتائج LazyWait کلاؤڈ کو بھیجتا ہے۔ Home Assistant رسائی ٹوکن درکار ہے۔ صرف aarch64۔"
  ha_url:
    name: "Home Assistant کا URL"
    description: "نقصان کی روک تھام کے ایجنٹ کے لیے Home Assistant کا پتہ۔ خالی چھوڑ دیں، جب تک Home Assistant کسی دوسرے ہوسٹ پر نہ چل رہا ہو (ڈیفالٹ: http://127.0.0.1:8123)۔"
  ha_token:
    name: "Home Assistant رسائی ٹوکن"
    description: "Home Assistant کے کسی ایڈمن صارف کا طویل مدتی رسائی ٹوکن، جسے نقصان کی روک تھام کا ایجنٹ استعمال کرتا ہے (پروفائل ← سیکیورٹی ← طویل مدتی رسائی ٹوکن)۔"
  isapi_username:
    name: "کیمرہ / NVR صارف نام"
    description: "نقصان کی روک تھام کے ثبوتی اسنیپ شاٹس، NVR پلے بیک اور کیمرے پر لوگوں کی گنتی کے لیے کیمرہ یا NVR اکاؤنٹ (Hikvision ISAPI)۔ یہ اسی ڈیوائس پر رہتا ہے۔ صرف کیمروں کی سب اسٹریمز کا تجزیہ کرنے کے لیے خالی چھوڑ دیں۔"
  isapi_password:
    name: "کیمرہ / NVR پاس ورڈ"
    description: "اوپر والے کیمرہ / NVR اکاؤنٹ کا پاس ورڈ۔ یہ اسی ڈیوائس پر رہتا ہے اور کبھی LazyWait کو نہیں بھیجا جاتا۔"
  lp_agent_port:
    name: "نقصان کی روک تھام کے ایجنٹ کا پورٹ"
    description: "نقصان کی روک تھام کے ایجنٹ کا مقامی پورٹ (ٹیسٹ موڈ اور ٹیبل کال کی تصدیق)۔ ڈیفالٹ: 8095۔ اسے صرف تب بدلیں جب یہ پورٹ اس ڈیوائس پر پہلے سے استعمال میں ہو۔"
  admin_password:
    name: "مقامی ایڈمن پاس ورڈ"
    description: "اگلی بار شروع ہونے پر پرنٹ سرور کے مقامی ایڈمن اکاؤنٹ کا نیا پاس ورڈ سیٹ کرتا ہے (کم از کم 8 حروف) اور تمام ایڈمن سیشنز سے سائن آؤٹ کر دیتا ہے۔ موجودہ پاس ورڈ رکھنے کے لیے خالی چھوڑ دیں۔ پہلے برانچ کے تمام ٹِل اپ ڈیٹ کریں: ڈیفالٹ پاس ورڈ سے لاگ اِن کرنے والے پرانے POS بلڈز اس کے بعد ڈیوائس سے ہی پرنٹ کریں گے۔"
