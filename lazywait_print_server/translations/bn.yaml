configuration:
  TZ:
    name: "সময় অঞ্চল"
    description: "স্টোরের সময় অঞ্চল, যেমন Asia/Riyadh। রসিদগুলো Home Assistant-এর নিজস্ব সময় অঞ্চলে (সেটিংস → সিস্টেম → সাধারণ) প্রিন্ট হয়, তাই সেখানেও স্টোরের সময় অঞ্চল সেট করুন।"
  PORT:
    name: "পোর্ট"
    description: "যে পোর্টে প্রিন্ট সার্ভার শোনে। ডিফল্ট: 80।"
  LAN_IP:
    name: "LAN IP ঠিকানা"
    description: "শাখার নেটওয়ার্কে এই ডিভাইসের IP ঠিকানা, যেমন 192.168.100.150। স্বয়ংক্রিয়ভাবে শনাক্ত করতে ফাঁকা রাখুন।"
  LAZYWAIT_API_BASE:
    name: "LazyWait ক্লাউড URL"
    description: "LazyWait ক্লাউড API-এর ঠিকানা। LazyWait সাপোর্ট অন্য কিছু না বললে ডিফল্ট (https://apiv2.lazywait.com/v1) রেখে দিন।"
  listen_orders:
    name: "অর্ডার স্বয়ংক্রিয়ভাবে প্রিন্ট করুন"
    description: "নতুন অর্ডারের দিকে নজর রাখে এবং স্বয়ংক্রিয়ভাবে প্রিন্ট করে। এই ডিভাইসে অর্ডার শোনা বন্ধ করতে বন্ধ করুন।"
  listen_openings:
    name: "ক্যাশিয়ার ওপেনিং স্বয়ংক্রিয়ভাবে প্রিন্ট করুন"
    description: "ক্যাশিয়ার ওপেনিংয়ের দিকে নজর রাখে এবং স্বয়ংক্রিয়ভাবে প্রিন্ট করে। এই শাখা ওপেনিং ব্যবহার না করলে বন্ধ করুন।"
  listen_closings:
    name: "ক্যাশিয়ার ক্লোজিং স্বয়ংক্রিয়ভাবে প্রিন্ট করুন"
    description: "ক্যাশিয়ার ক্লোজিংয়ের দিকে নজর রাখে এবং স্বয়ংক্রিয়ভাবে প্রিন্ট করে। এই শাখা ক্লোজিং ব্যবহার না করলে বন্ধ করুন।"
  enable_camera_ai:
    name: "ক্যামেরা AI-এর অনুমতি দিন"
    description: "ক্যামেরা AI-এর মূল সুইচ। চালু থাকলেও ক্যামেরা AI প্রিন্ট সার্ভারের ফিচার পেজ থেকে চালু বা বন্ধ করা হয় (ডিফল্টভাবে বন্ধ)। এই ডিভাইসে এটি কখনো চালু হতে না দিতে বন্ধ করুন।"
  enable_live_webrtc:
    name: "সরাসরি লাইভ ক্যামেরা ভিউ"
    description: "LazyWait অ্যাপগুলোকে এই ডিভাইস থেকে সরাসরি লাইভ ক্যামেরা ভিডিও চালাতে দেয় (পোর্ট 18556 UDP/TCP-তে পিয়ার-টু-পিয়ার WebRTC)। LazyWait ক্লাউড শুধু দুই পক্ষকে সংযুক্ত হতে সাহায্য করে; ভিডিও কখনো এর মধ্য দিয়ে যায় না। ডিফল্টভাবে চালু। স্থানীয় ভিডিও পরিষেবা বন্ধ করতে এটি বন্ধ করুন।"
  enable_loss_prevention:
    name: "লস প্রিভেনশন"
    description: "লস প্রিভেনশন এজেন্ট চালু করে (ডিফল্টভাবে বন্ধ)। এটি ERP-তে ম্যাপ করা Home Assistant এনটিটিগুলো (শাটার, দরজা, লক, অ্যালার্ম, লাইট, মোশন, ক্যাশ ড্রয়ার) পর্যবেক্ষণ করে এবং স্বাক্ষরিত ফলাফল LazyWait ক্লাউডে পাঠায়। একটি Home Assistant অ্যাক্সেস টোকেন প্রয়োজন। শুধু aarch64-এর জন্য।"
  ha_url:
    name: "Home Assistant URL"
    description: "লস প্রিভেনশন এজেন্টের জন্য Home Assistant-এর ঠিকানা। Home Assistant অন্য কোনো হোস্টে না চললে ফাঁকা রাখুন (ডিফল্ট: http://127.0.0.1:8123)।"
  ha_token:
    name: "Home Assistant অ্যাক্সেস টোকেন"
    description: "একজন Home Assistant অ্যাডমিন ব্যবহারকারীর দীর্ঘমেয়াদি অ্যাক্সেস টোকেন, যা লস প্রিভেনশন এজেন্ট ব্যবহার করে (প্রোফাইল → নিরাপত্তা → দীর্ঘমেয়াদি অ্যাক্সেস টোকেন)।"
  isapi_username:
    name: "ক্যামেরা / NVR ব্যবহারকারীর নাম"
    description: "লস প্রিভেনশনের প্রমাণ-স্ন্যাপশট, NVR প্লেব্যাক এবং ক্যামেরায় মানুষ গণনার জন্য ক্যামেরা বা NVR অ্যাকাউন্ট (Hikvision ISAPI)। এটি এই ডিভাইসেই থাকে। শুধু ক্যামেরার সাব-স্ট্রিম বিশ্লেষণ করতে ফাঁকা রাখুন।"
  isapi_password:
    name: "ক্যামেরা / NVR পাসওয়ার্ড"
    description: "উপরের ক্যামেরা / NVR অ্যাকাউন্টের পাসওয়ার্ড। এটি এই ডিভাইসেই থাকে এবং কখনো LazyWait-এ পাঠানো হয় না।"
  lp_agent_port:
    name: "লস প্রিভেনশন এজেন্টের পোর্ট"
    description: "লস প্রিভেনশন এজেন্টের লোকাল পোর্ট (টেস্ট মোড এবং টেবিল-কলের স্বীকৃতি)। ডিফল্ট: 8095। এই ডিভাইসে পোর্টটি আগে থেকেই ব্যবহৃত হলে তবেই বদলান।"
  admin_password:
    name: "লোকাল অ্যাডমিন পাসওয়ার্ড"
    description: "পরের বার চালু হওয়ার সময় প্রিন্ট সার্ভারের লোকাল অ্যাডমিন অ্যাকাউন্টের নতুন পাসওয়ার্ড সেট করে (কমপক্ষে 8 অক্ষর) এবং সব অ্যাডমিন সেশন থেকে সাইন আউট করে। বর্তমান পাসওয়ার্ড রাখতে ফাঁকা রাখুন। আগে শাখার প্রতিটি টিল আপডেট করুন: ডিফল্ট পাসওয়ার্ড দিয়ে লগ ইন করা পুরোনো POS বিল্ডগুলো তখন ডিভাইস থেকেই প্রিন্ট করবে।"
