configuration:
  TZ:
    name: "Ժամային գոտի"
    description: "Խանութի ժամային գոտին, օրինակ՝ Asia/Riyadh։ Կտրոնները տպվում են Home Assistant-ի սեփական ժամային գոտով (Կարգավորումներ → Համակարգ → Ընդհանուր), ուստի այնտեղ նույնպես սահմանեք խանութի ժամային գոտին։"
  PORT:
    name: "Պորտ"
    description: "Պորտը, որով տպման սերվերը սպասում է միացումների։ Լռելյայն՝ 80։"
  LAN_IP:
    name: "LAN IP հասցե"
    description: "Այս սարքի IP հասցեն մասնաճյուղի ցանցում, օրինակ՝ 192.168.100.150։ Թողեք դատարկ՝ ավտոմատ որոշելու համար։"
  LAZYWAIT_API_BASE:
    name: "LazyWait ամպի URL"
    description: "LazyWait ամպի API հասցեն։ Պահպանեք լռելյայն արժեքը (https://apiv2.lazywait.com/v1), եթե LazyWait-ի աջակցությունն այլ բան չի ասել։"
  listen_orders:
    name: "Պատվերների ավտոմատ տպում"
    description: "Հետևում է նոր պատվերներին և ավտոմատ տպում դրանք։ Անջատեք՝ այս սարքում պատվերներին հետևելը դադարեցնելու համար։"
  listen_openings:
    name: "Դրամարկղի բացումների ավտոմատ տպում"
    description: "Հետևում է դրամարկղի բացումներին և ավտոմատ տպում դրանք։ Անջատեք, եթե այս մասնաճյուղը բացումներ չի օգտագործում։"
  listen_closings:
    name: "Դրամարկղի փակումների ավտոմատ տպում"
    description: "Հետևում է դրամարկղի փակումներին և ավտոմատ տպում դրանք։ Անջատեք, եթե այս մասնաճյուղը փակումներ չի օգտագործում։"
  enable_camera_ai:
    name: "Թույլատրել տեսախցիկների AI-ը"
    description: "Տեսախցիկների AI-ի գլխավոր անջատիչը։ Միացված լինելու դեպքում տեսախցիկների AI-ը դեռ միացվում կամ անջատվում է տպման սերվերի «Գործառույթներ» էջից (լռելյայն՝ անջատված)։ Անջատեք, որպեսզի այն երբեք չգործարկվի այս սարքում։"
  enable_live_webrtc:
    name: "Տեսախցիկների անմիջական ուղիղ դիտում"
    description: "Թույլ է տալիս LazyWait հավելվածներին տեսախցիկների ուղիղ տեսանյութը նվագարկել անմիջապես այս սարքից (peer-to-peer WebRTC՝ 18556 UDP/TCP պորտով)։ LazyWait ամպը միայն օգնում է երկու կողմերին միանալ, տեսանյութը երբեք չի անցնում դրա միջով։ Լռելյայն միացված է։ Անջատեք՝ տեղային տեսածառայությունը դադարեցնելու համար։"
  enable_loss_prevention:
    name: "Կորուստների կանխարգելում"
    description: "Միացնում է կորուստների կանխարգելման գործակալը (լռելյայն անջատված է)։ Այն հետևում է ERP-ում կապված Home Assistant-ի օբյեկտներին (փեղկ, դուռ, կողպեք, ազդանշանային համակարգ, լուսավորություն, շարժում, դրամարկղի դարակ) և ստորագրված արդյունքներ է ուղարկում LazyWait-ի ամպ։ Պահանջում է Home Assistant-ի մուտքի տոկեն։ Միայն aarch64։"
  ha_url:
    name: "Home Assistant-ի URL"
    description: "Home Assistant-ի հասցեն կորուստների կանխարգելման գործակալի համար։ Թողեք դատարկ, եթե Home Assistant-ը չի աշխատում այլ հոսթի վրա (լռելյայն՝ http://127.0.0.1:8123)։"
  ha_token:
    name: "Home Assistant-ի մուտքի տոկեն"
    description: "Home Assistant-ի ադմինիստրատոր օգտատիրոջ երկարաժամկետ մուտքի տոկեն, որն օգտագործում է կորուստների կանխարգելման գործակալը (Պրոֆիլ → Անվտանգություն → Երկարաժամկետ մուտքի տոկեններ)։"
  isapi_username:
    name: "Տեսախցիկի / NVR-ի օգտանուն"
    description: "Տեսախցիկի կամ NVR-ի հաշիվը (Hikvision ISAPI)՝ ապացուցողական լուսանկարների, NVR-ի տեսագրությունների դիտման և տեսախցիկում մարդկանց հաշվարկի համար։ Մնում է այս սարքում։ Թողեք դատարկ՝ միայն տեսախցիկների ենթահոսքերը վերլուծելու համար։"
  isapi_password:
    name: "Տեսախցիկի / NVR-ի գաղտնաբառ"
    description: "Վերևում նշված տեսախցիկի / NVR-ի հաշվի գաղտնաբառը։ Մնում է այս սարքում և երբեք չի ուղարկվում LazyWait։"
  lp_agent_port:
    name: "Կորուստների կանխարգելման գործակալի պորտ"
    description: "Կորուստների կանխարգելման գործակալի տեղային պորտը (փորձարկման ռեժիմ և սեղանի կանչերի հաստատումներ)։ Լռելյայն՝ 8095։ Փոխեք միայն այն դեպքում, եթե այդ պորտն արդեն զբաղված է այս սարքում։"
  admin_password:
    name: "Տեղային ադմինիստրատորի գաղտնաբառ"
    description: "Հաջորդ գործարկման ժամանակ սահմանում է տպման սերվերի տեղային ադմինիստրատորի հաշվի նոր գաղտնաբառ (առնվազն 8 նիշ) և դուրս է հանում բոլոր ադմինիստրատորային սեսիաներից։ Թողեք դատարկ՝ ընթացիկ գաղտնաբառը պահելու համար։ Նախ թարմացրեք մասնաճյուղի բոլոր դրամարկղերը։ POS-ի հին տարբերակները, որոնք մուտք են գործում լռելյայն գաղտնաբառով, այնուհետև կտպեն անմիջապես սարքից։"
