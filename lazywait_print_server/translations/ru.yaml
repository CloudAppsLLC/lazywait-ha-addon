configuration:
  TZ:
    name: "Часовой пояс"
    description: "Часовой пояс магазина, например Asia/Riyadh. Чеки печатаются в часовом поясе самого Home Assistant (Настройки → Система → Общие), поэтому укажите там тоже часовой пояс магазина."
  PORT:
    name: "Порт"
    description: "Порт, который прослушивает сервер печати. По умолчанию: 80."
  LAN_IP:
    name: "IP-адрес в локальной сети"
    description: "IP-адрес этого устройства в сети филиала, например 192.168.100.150. Оставьте пустым для автоматического определения."
  LAZYWAIT_API_BASE:
    name: "URL облака LazyWait"
    description: "Адрес API облака LazyWait. Оставьте значение по умолчанию (https://apiv2.lazywait.com/v1), если поддержка LazyWait не указала иное."
  listen_orders:
    name: "Автопечать заказов"
    description: "Отслеживает новые заказы и автоматически печатает их. Отключите, чтобы перестать отслеживать заказы на этом устройстве."
  listen_openings:
    name: "Автопечать открытий кассы"
    description: "Отслеживает открытия кассы и автоматически печатает их. Отключите, если этот филиал не использует открытия."
  listen_closings:
    name: "Автопечать закрытий кассы"
    description: "Отслеживает закрытия кассы и автоматически печатает их. Отключите, если этот филиал не использует закрытия."
  enable_camera_ai:
    name: "Разрешить ИИ камер"
    description: "Главный выключатель ИИ камер. Если он включён, ИИ камер по-прежнему включается и отключается (по умолчанию отключён) на странице «Функции» сервера печати. Отключите, чтобы он никогда не запускался на этом устройстве."
  enable_live_webrtc:
    name: "Прямой просмотр камер в реальном времени"
    description: "Позволяет приложениям LazyWait воспроизводить видео с камер в реальном времени напрямую с этого устройства (одноранговый WebRTC на порту 18556 UDP/TCP). Облако LazyWait лишь помогает сторонам соединиться; видео никогда через него не проходит. Включено по умолчанию. Выключите, чтобы остановить локальную видеослужбу."
  enable_loss_prevention:
    name: "Предотвращение потерь"
    description: "Включает агент предотвращения потерь (по умолчанию выключен). Он отслеживает сущности Home Assistant, сопоставленные в ERP (рольставни, дверь, замок, сигнализация, освещение, движение, денежный ящик), и отправляет подписанные результаты в облако LazyWait. Нужен токен доступа Home Assistant. Только aarch64."
  ha_url:
    name: "URL Home Assistant"
    description: "Адрес Home Assistant для агента предотвращения потерь. Оставьте пустым, если Home Assistant не работает на другом хосте (по умолчанию: http://127.0.0.1:8123)."
  ha_token:
    name: "Токен доступа Home Assistant"
    description: "Долгосрочный токен доступа пользователя-администратора Home Assistant, который использует агент предотвращения потерь (Профиль → Безопасность → Долгосрочные токены доступа)."
  isapi_username:
    name: "Имя пользователя камеры / NVR"
    description: "Учётная запись камеры или видеорегистратора (Hikvision ISAPI) для снимков-доказательств, воспроизведения с NVR и подсчёта людей камерой при предотвращении потерь. Хранится на этом устройстве. Оставьте пустым, чтобы анализировать только дополнительные потоки камер."
  isapi_password:
    name: "Пароль камеры / NVR"
    description: "Пароль указанной выше учётной записи камеры / NVR. Хранится на этом устройстве и никогда не отправляется в LazyWait."
  lp_agent_port:
    name: "Порт агента предотвращения потерь"
    description: "Локальный порт агента предотвращения потерь (тестовый режим и подтверждения вызовов со столов). По умолчанию: 8095. Меняйте, только если этот порт уже занят на этом устройстве."
  admin_password:
    name: "Пароль локального администратора"
    description: "Задаёт новый пароль локальной учётной записи администратора сервера печати при следующем запуске (не менее 8 символов) и завершает все сеансы администратора. Оставьте пустым, чтобы сохранить текущий пароль. Сначала обновите все кассы филиала: старые версии POS, которые входят с паролем по умолчанию, будут печатать прямо с устройства."
