configuration:
  TZ:
    name: "المنطقة الزمنية"
    description: "المنطقة الزمنية للمتجر، مثل Asia/Riyadh. تُطبع الإيصالات بالمنطقة الزمنية لـ Home Assistant نفسه (الإعدادات ← النظام ← عام)، لذا اضبطها أيضًا على منطقة المتجر."
  PORT:
    name: "المنفذ"
    description: "المنفذ الذي يستمع عليه خادم الطباعة. الافتراضي: 80."
  LAN_IP:
    name: "عنوان IP في الشبكة المحلية"
    description: "عنوان IP لهذا الجهاز على شبكة الفرع، مثل 192.168.100.150. اتركه فارغًا لاكتشافه تلقائيًا."
  LAZYWAIT_API_BASE:
    name: "رابط سحابة LazyWait"
    description: "عنوان واجهة API لسحابة LazyWait. أبقِ القيمة الافتراضية (https://apiv2.lazywait.com/v1) ما لم يطلب منك دعم LazyWait غير ذلك."
  listen_orders:
    name: "طباعة الطلبات تلقائيًا"
    description: "يراقب الطلبات الجديدة ويطبعها تلقائيًا. أوقفه لإيقاف مراقبة الطلبات على هذا الجهاز."
  listen_openings:
    name: "طباعة افتتاح الكاشير تلقائيًا"
    description: "يراقب عمليات افتتاح الكاشير ويطبعها تلقائيًا. أوقفه إذا كان هذا الفرع لا يستخدم الافتتاح."
  listen_closings:
    name: "طباعة إغلاق الكاشير تلقائيًا"
    description: "يراقب عمليات إغلاق الكاشير ويطبعها تلقائيًا. أوقفه إذا كان هذا الفرع لا يستخدم الإغلاق."
  enable_camera_ai:
    name: "السماح بالذكاء الاصطناعي للكاميرات"
    description: "المفتاح الرئيسي للذكاء الاصطناعي للكاميرات. عند تشغيله، يظل تشغيل الذكاء الاصطناعي للكاميرات أو إيقافه من صفحة الميزات في خادم الطباعة (متوقف افتراضيًا). أوقفه لمنعه من البدء على هذا الجهاز نهائيًا."
  enable_live_webrtc:
    name: "العرض المباشر للكاميرات (اتصال مباشر)"
    description: "يتيح لتطبيقات LazyWait تشغيل البث المباشر للكاميرات من هذا الجهاز مباشرةً (WebRTC من نظير إلى نظير على المنفذ 18556 UDP/TCP). تساعد سحابة LazyWait الطرفين على الاتصال فقط، ولا يمر الفيديو عبرها أبدًا. مفعّل افتراضيًا. أوقفه لإيقاف خدمة الفيديو المحلية."
  enable_loss_prevention:
    name: "منع الخسائر"
    description: "يشغّل وكيل منع الخسائر (متوقف افتراضيًا). يراقب كيانات Home Assistant المرتبطة في نظام ERP (الغالق، الباب، القفل، الإنذار، الإضاءة، الحركة، درج النقود) ويرسل نتائج موقّعة إلى سحابة LazyWait. يحتاج إلى رمز وصول Home Assistant. لأجهزة aarch64 فقط."
  ha_url:
    name: "رابط Home Assistant"
    description: "عنوان Home Assistant لوكيل منع الخسائر. اتركه فارغًا ما لم يكن Home Assistant يعمل على جهاز آخر (الافتراضي: http://127.0.0.1:8123)."
  ha_token:
    name: "رمز وصول Home Assistant"
    description: "رمز وصول طويل الأمد لمستخدم مسؤول في Home Assistant، يستخدمه وكيل منع الخسائر (الملف الشخصي ← الأمان ← رموز الوصول طويلة الأمد)."
  isapi_username:
    name: "اسم مستخدم الكاميرا / NVR"
    description: "حساب الكاميرا أو مسجّل NVR (Hikvision ISAPI) المستخدم للقطات الأدلة في منع الخسائر وتشغيل تسجيلات NVR وعدّ الأشخاص على الكاميرا. يبقى على هذا الجهاز. اتركه فارغًا لتحليل البث الفرعي للكاميرات فقط."
  isapi_password:
    name: "كلمة مرور الكاميرا / NVR"
    description: "كلمة مرور حساب الكاميرا / NVR أعلاه. تبقى على هذا الجهاز ولا تُرسل أبدًا إلى LazyWait."
  lp_agent_port:
    name: "منفذ وكيل منع الخسائر"
    description: "المنفذ المحلي لوكيل منع الخسائر (وضع الاختبار وتأكيدات نداءات الطاولات). الافتراضي: 8095. غيّره فقط إذا كان هذا المنفذ مستخدمًا بالفعل على هذا الجهاز."
  admin_password:
    name: "كلمة مرور المسؤول المحلي"
    description: "يعيّن كلمة مرور جديدة لحساب المسؤول المحلي في خادم الطباعة عند التشغيل التالي (8 أحرف على الأقل) ويُنهي جميع جلسات المسؤول. اتركه فارغًا للإبقاء على كلمة المرور الحالية. حدّث كل أجهزة الكاشير في الفرع أولًا: الإصدارات الأقدم من نقطة البيع التي تسجّل الدخول بكلمة المرور الافتراضية ستطبع من الجهاز نفسه بدلًا من ذلك."
