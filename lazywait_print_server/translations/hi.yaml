configuration:
  TZ:
    name: "समय क्षेत्र"
    description: "स्टोर का समय क्षेत्र, जैसे Asia/Riyadh। रसीदें Home Assistant के अपने समय क्षेत्र (सेटिंग्स → सिस्टम → सामान्य) में प्रिंट होती हैं, इसलिए वहां भी स्टोर का समय क्षेत्र सेट करें।"
  PORT:
    name: "पोर्ट"
    description: "वह पोर्ट जिस पर प्रिंट सर्वर सुनता है। डिफ़ॉल्ट: 80।"
  LAN_IP:
    name: "LAN IP पता"
    description: "शाखा नेटवर्क पर इस डिवाइस का IP पता, जैसे 192.168.100.150। अपने-आप पता लगाने के लिए खाली छोड़ें।"
  LAZYWAIT_API_BASE:
    name: "LazyWait क्लाउड URL"
    description: "LazyWait क्लाउड API का पता। जब तक LazyWait सपोर्ट कुछ और न कहे, डिफ़ॉल्ट (https://apiv2.lazywait.com/v1) ही रखें।"
  listen_orders:
    name: "ऑर्डर अपने-आप प्रिंट करें"
    description: "नए ऑर्डर पर नज़र रखता है और उन्हें अपने-आप प्रिंट करता है। इस डिवाइस पर ऑर्डर सुनना बंद करने के लिए बंद करें।"
  listen_openings:
    name: "कैशियर ओपनिंग अपने-आप प्रिंट करें"
    description: "कैशियर ओपनिंग पर नज़र रखता है और उन्हें अपने-आप प्रिंट करता है। अगर यह शाखा ओपनिंग का उपयोग नहीं करती, तो बंद करें।"
  listen_closings:
    name: "कैशियर क्लोजिंग अपने-आप प्रिंट करें"
    description: "कैशियर क्लोजिंग पर नज़र रखता है और उन्हें अपने-आप प्रिंट करता है। अगर यह शाखा क्लोजिंग का उपयोग नहीं करती, तो बंद करें।"
  enable_camera_ai:
    name: "कैमरा AI की अनुमति दें"
    description: "कैमरा AI का मुख्य स्विच। चालू होने पर भी कैमरा AI को प्रिंट सर्वर के फ़ीचर पेज से चालू या बंद किया जाता है (डिफ़ॉल्ट रूप से बंद)। इस डिवाइस पर इसे कभी शुरू न होने देने के लिए बंद करें।"
  enable_live_webrtc:
    name: "सीधा लाइव कैमरा व्यू"
    description: "LazyWait ऐप्स को इस डिवाइस से सीधे लाइव कैमरा वीडियो चलाने देता है (पोर्ट 18556 UDP/TCP पर पीयर-टू-पीयर WebRTC)। LazyWait क्लाउड केवल दोनों पक्षों को जुड़ने में मदद करता है; वीडियो कभी उससे होकर नहीं जाता। डिफ़ॉल्ट रूप से चालू। स्थानीय वीडियो सेवा रोकने के लिए इसे बंद करें।"
  enable_loss_prevention:
    name: "लॉस प्रिवेंशन"
    description: "लॉस प्रिवेंशन एजेंट चालू करता है (डिफ़ॉल्ट रूप से बंद)। यह ERP में मैप की गई Home Assistant एंटिटी (शटर, दरवाज़ा, लॉक, अलार्म, लाइट, मोशन, कैश ड्रॉअर) पर नज़र रखता है और हस्ताक्षरित परिणाम LazyWait क्लाउड को भेजता है। Home Assistant एक्सेस टोकन ज़रूरी है। केवल aarch64।"
  ha_url:
    name: "Home Assistant URL"
    description: "लॉस प्रिवेंशन एजेंट के लिए Home Assistant का पता। खाली छोड़ें, जब तक Home Assistant किसी दूसरे होस्ट पर न चल रहा हो (डिफ़ॉल्ट: http://127.0.0.1:8123)।"
  ha_token:
    name: "Home Assistant एक्सेस टोकन"
    description: "Home Assistant के किसी एडमिन उपयोगकर्ता का लंबी अवधि वाला एक्सेस टोकन, जिसे लॉस प्रिवेंशन एजेंट इस्तेमाल करता है (प्रोफ़ाइल → सुरक्षा → लंबी अवधि के एक्सेस टोकन)।"
  isapi_username:
    name: "कैमरा / NVR उपयोगकर्ता नाम"
    description: "लॉस प्रिवेंशन के सबूत स्नैपशॉट, NVR प्लेबैक और कैमरे पर लोगों की गिनती के लिए कैमरा या NVR खाता (Hikvision ISAPI)। यह इसी डिवाइस पर रहता है। केवल कैमरों की सब-स्ट्रीम का विश्लेषण करने के लिए खाली छोड़ें।"
  isapi_password:
    name: "कैमरा / NVR पासवर्ड"
    description: "ऊपर दिए गए कैमरा / NVR खाते का पासवर्ड। यह इसी डिवाइस पर रहता है और कभी LazyWait को नहीं भेजा जाता।"
  lp_agent_port:
    name: "लॉस प्रिवेंशन एजेंट पोर्ट"
    description: "लॉस प्रिवेंशन एजेंट का लोकल पोर्ट (टेस्ट मोड और टेबल-कॉल की पुष्टि)। डिफ़ॉल्ट: 8095। इसे तभी बदलें जब यह पोर्ट इस डिवाइस पर पहले से इस्तेमाल हो रहा हो।"
  admin_password:
    name: "लोकल एडमिन पासवर्ड"
    description: "अगली बार शुरू होने पर प्रिंट सर्वर के लोकल एडमिन खाते का नया पासवर्ड सेट करता है (कम से कम 8 अक्षर) और सभी एडमिन सत्रों से साइन आउट कर देता है। मौजूदा पासवर्ड रखने के लिए खाली छोड़ें। पहले शाखा के सभी टिल अपडेट करें: डिफ़ॉल्ट पासवर्ड से लॉग इन करने वाले पुराने POS बिल्ड तब डिवाइस से ही प्रिंट करेंगे।"
