configuration:
  TZ:
    name: "Часова зона"
    description: "Часовата зона на обекта, напр. Asia/Riyadh. Касовите бележки се отпечатват в часовата зона на самия Home Assistant (Настройки → Система → Общи), затова задайте и там часовата зона на обекта."
  PORT:
    name: "Порт"
    description: "Портът, на който слуша сървърът за печат. По подразбиране: 80."
  LAN_IP:
    name: "IP адрес в LAN"
    description: "IP адресът на това устройство в мрежата на клона, напр. 192.168.100.150. Оставете празно за автоматично откриване."
  LAZYWAIT_API_BASE:
    name: "URL адрес на облака LazyWait"
    description: "Адресът на API на облака LazyWait. Запазете стойността по подразбиране (https://apiv2.lazywait.com/v1), освен ако поддръжката на LazyWait не каже друго."
  listen_orders:
    name: "Автоматичен печат на поръчки"
    description: "Следи за нови поръчки и ги отпечатва автоматично. Изключете, за да спрете следенето на поръчки на това устройство."
  listen_openings:
    name: "Автоматичен печат на отваряния на каса"
    description: "Следи за отваряния на каса и ги отпечатва автоматично. Изключете, ако този клон не използва отваряния."
  listen_closings:
    name: "Автоматичен печат на приключвания на каса"
    description: "Следи за приключвания на каса и ги отпечатва автоматично. Изключете, ако този клон не използва приключвания."
  enable_camera_ai:
    name: "Разрешаване на ИИ за камери"
    description: "Главен превключвател за ИИ на камерите. Когато е включен, ИИ на камерите пак се включва или изключва (по подразбиране е изключен) от страницата „Функции“ на сървъра за печат. Изключете, за да не се стартира никога на това устройство."
  enable_live_webrtc:
    name: "Директен изглед на камерите на живо"
    description: "Позволява на приложенията на LazyWait да възпроизвеждат видео от камерите на живо директно от това устройство (WebRTC от точка до точка на порт 18556 UDP/TCP). Облакът на LazyWait само помага на двете страни да се свържат; видеото никога не минава през него. Включено по подразбиране. Изключете, за да спрете локалната видео услуга."
  enable_loss_prevention:
    name: "Предотвратяване на загуби"
    description: "Включва агента за предотвратяване на загуби (изключен по подразбиране). Той следи обектите в Home Assistant, свързани в ERP (ролетна щора, врата, ключалка, аларма, осветление, движение, касово чекмедже), и изпраща подписани резултати към облака на LazyWait. Изисква токен за достъп до Home Assistant. Само за aarch64."
  ha_url:
    name: "URL адрес на Home Assistant"
    description: "Адресът на Home Assistant за агента за предотвратяване на загуби. Оставете празно, освен ако Home Assistant не работи на друг хост (по подразбиране: http://127.0.0.1:8123)."
  ha_token:
    name: "Токен за достъп до Home Assistant"
    description: "Дълготраен токен за достъп на администратор в Home Assistant, използван от агента за предотвратяване на загуби (Профил → Сигурност → Дълготрайни токени за достъп)."
  isapi_username:
    name: "Потребителско име за камера / NVR"
    description: "Акаунтът на камерата или NVR (Hikvision ISAPI) за снимки-доказателства, възпроизвеждане от NVR и броене на хора от камерата при предотвратяването на загуби. Остава на това устройство. Оставете празно, за да се анализират само подпотоците на камерите."
  isapi_password:
    name: "Парола за камера / NVR"
    description: "Паролата на горния акаунт за камера / NVR. Остава на това устройство и никога не се изпраща към LazyWait."
  lp_agent_port:
    name: "Порт на агента за предотвратяване на загуби"
    description: "Локалният порт на агента за предотвратяване на загуби (тестов режим и потвърждения на повиквания от маси). По подразбиране: 8095. Променяйте го само ако портът вече е зает на това устройство."
  admin_password:
    name: "Парола на локалния администратор"
    description: "Задава нова парола за локалния администраторски акаунт на сървъра за печат при следващото стартиране (поне 8 знака) и прекратява всички администраторски сесии. Оставете празно, за да запазите текущата парола. Първо обновете всички каси в обекта: по-старите версии на POS, които влизат с паролата по подразбиране, ще печатат директно от устройството."
